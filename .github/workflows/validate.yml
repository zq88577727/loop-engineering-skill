name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run repository validator
        run: python3 scripts/validate_repo.py

      - name: Compile Python scripts
        run: python3 -m py_compile scripts/validate_repo.py scripts/create_github_release.py skills/loop-engineering/scripts/init_loop_project.py evals/run_offline_eval.py evals/run_live_eval.py evals/validators/validate_loop_output.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run offline behavior eval
        run: python3 evals/run_offline_eval.py

      - name: Run initializer smoke test
        run: python3 skills/loop-engineering/scripts/init_loop_project.py --target /tmp/loop-engineering-smoke
